<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TES AUTH SUPABASE</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 400px; margin: 0 auto; border: 1px solid #333; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        button { background: #d4af37; color: #000; font-weight: bold; cursor: pointer; border: none; }
        button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
        #log { margin-top: 20px; padding: 15px; background: #000; border: 1px solid #333; border-radius: 5px; font-family: monospace; font-size: 12px; color: #0f0; white-space: pre-wrap; word-wrap: break-word; height: 200px; overflow-y: auto; }
        .red { color: #ff5555 !important; }
        .yellow { color: #ffb86c !important; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="text-align: center;">Tes Login/Register</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        
        <button id="btn-reg" onclick="tesRegister()">TEST REGISTER</button>
        <button id="btn-log" onclick="tesLogin()" style="background:#4caf50; color:#fff;">TEST LOGIN</button>
        
        <div id="log">Menunggu perintah...</div>
    </div>

    <script>
        // Tulis log ke layar
        function tulisLog(pesan, tipe = 'normal') {
            const log = document.getElementById('log');
            const warna = tipe === 'error' ? 'red' : tipe === 'warn' ? 'yellow' : '';
            log.innerHTML += `<br><span class="${warna}">> ${pesan}</span>`;
            log.scrollTop = log.scrollHeight;
        }

        const SUPABASE_URL = 'https://honxcvnpdruthlygwdyo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_FVoqUlD3xsLW89Ms9CseEg_5__lHrRh';
        
        let supabase = null;

        try {
            tulisLog("Memuat library...");
            if (!window.supabase) throw new Error("Library gagal didownload (unpkg diblokir).");
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            tulisLog("Sistem siap. Silakan isi form dan klik tombol.", "normal");
        } catch (err) {
            tulisLog("FATAL ERROR: " + err.message, "error");
        }

        async function tesRegister() {
            const btn = document.getElementById('btn-reg');
            btn.innerText = "MEMPROSES..."; btn.disabled = true;
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const username = document.getElementById('username').value;

            if(!email || !password) {
                tulisLog("Email dan Password wajib diisi!", "warn");
                btn.innerText = "TEST REGISTER"; btn.disabled = false;
                return;
            }

            tulisLog(`Mengirim data register untuk: ${email}...`);
            document.getElementById('log').style.color = '#fff';

            try {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: { data: { username: username || 'user_test' } }
                });

                if (error) throw error;
                
                tulisLog("✅ SUKSES REGISTER! Cek tab 'Users' di Supabase.", "normal");
                if (data.user) tulisLog(`ID User: ${data.user.id}`, "normal");
                if (data.session) {
                    tulisLog("Session langsung didapat (Email confirm OFF).", "normal");
                } else {
                    tulisLog("Peringatan: Session kosong. Cek settingan 'Confirm email' di Supabase, pastikan OFF.", "warn");
                }

            } catch (err) {
                tulisLog("❌ GAGAL REGISTER: " + err.message, "error");
            } finally {
                btn.innerText = "TEST REGISTER"; btn.disabled = false;
            }
        }

        async function tesLogin() {
            const btn = document.getElementById('btn-log');
            btn.innerText = "MEMPROSES..."; btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(!email || !password) {
                tulisLog("Email dan Password wajib diisi!", "warn");
                btn.innerText = "TEST LOGIN"; btn.disabled = false;
                return;
            }

            tulisLog(`Mengirim data login untuk: ${email}...`);

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) throw error;

                tulisLog("✅ SUKSES LOGIN!", "normal");
                tulisLog(`Selamat datang, ${data.user.user_metadata.username || data.user.email}`, "normal");
                tulisLog(`Token aktif didapatkan.`, "normal");

            } catch (err) {
                tulisLog("❌ GAGAL LOGIN: " + err.message, "error");
            } finally {
                btn.innerText = "TEST LOGIN"; btn.disabled = false;
            }
        }
    </script>
</body>
</html>
