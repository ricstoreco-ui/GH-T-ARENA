<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GH-T ARENA</title>
    <!-- PAKAI CDN UNPKG -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        button { background: #d4af37; color: #000; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
        button:hover { background: #f1c40f; }
        .hidden { display: none; }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav button { width: auto; background: #333; color: #fff; }
        
        /* Kotak Notifikasi */
        #msg-box { padding: 15px; margin-bottom: 20px; border-radius: 5px; display: none; font-weight: bold; text-align: center; font-size: 14px; word-wrap: break-word; }
        .msg-error { background-color: #c62828; color: white; display: block !important; }
        .msg-success { background-color: #2e7d32; color: white; display: block !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center;">GH-T ARENA</h1>
        
        <div id="msg-box"></div>

        <div class="nav" id="nav-menu">
            <button onclick="showSection('auth-section')">Login / Register</button>
            <button onclick="showSection('dashboard-section')">Dashboard</button>
        </div>
        
        <div id="user-status" style="text-align: right; margin-bottom: 10px;"></div>

        <!-- FORM LOGIN & REGISTER -->
        <div id="auth-section" class="card">
            <h2>Login / Register</h2>
            <input type="text" id="auth-username" placeholder="Username (Khusus Register)">
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-password" placeholder="Password">
            <button onclick="handleLogin()">Login</button>
            <button id="btn-reg" onclick="handleRegister()" style="background:#555; color:#fff;">Register</button>
        </div>

        <!-- DASHBOARD CAPTAIN -->
        <div id="dashboard-section" class="card hidden">
            <h2>Dashboard Captain</h2>
            <h3>Buat Tim Baru</h3>
            <input type="text" id="team-name" placeholder="Nama Tim">
            <input type="text" id="team-desc" placeholder="Deskripsi Tim (Opsional)">
            <button onclick="createTeam()">Simpan Tim</button>
            <h3>Tim Saya</h3>
            <ul id="my-teams-list"></ul>
        </div>
    </div>

    <script>
        // KONFIGURASI
        const SUPABASE_URL = 'https://honxcvnpdruthlygwdyo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_FVoqUlD3xsLW89Ms9CseEg_5__lHrRh';
        
        let supabase = null;
        let currentUser = null;

        try {
            if (!window.supabase) throw new Error("Library gagal dimuat.");
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (err) {
            showMsg("GAGAL INISIALISASI: " + err.message, "error");
        }

        function showMsg(text, type) {
            const box = document.getElementById('msg-box');
            box.innerText = text;
            box.className = type === 'error' ? 'msg-error' : 'msg-success';
            setTimeout(() => { box.className = ''; box.style.display = 'none'; }, 8000);
        }

        function showSection(id) {
            ['auth-section', 'dashboard-section'].forEach(sec => {
                document.getElementById(sec).classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');
        }

        // ================= LOGIKA REGISTER =================
        async function handleRegister() {
            const btn = document.getElementById('btn-reg');
            btn.innerText = "LOADING..."; // Ubah tombol jadi LOADING

            if (!supabase) {
                btn.innerText = "Register";
                return showMsg("Database tidak siap.", "error");
            }

            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const username = document.getElementById('auth-username').value;

            if(!username || !email || !password) {
                btn.innerText = "Register";
                return showMsg("Isi Username, Email, dan Password!", "error");
            }

            showMsg("Sedang memproses pendaftaran...", "success");

            try {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: { data: { username: username } }
                });

                if (error) throw error;
                showMsg("Registrasi Berhasil! Silakan klik Login.", "success");
            } catch (err) {
                showMsg("ERROR REGISTER: " + err.message, "error"); 
            } finally {
                btn.innerText = "Register"; // Balikin nama tombol
            }
        }

        // ================= LOGIKA LOGIN =================
        async function handleLogin() {
            if (!supabase) return showMsg("Database tidak siap.", "error");
            
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if(!email || !password) return showMsg("Isi Email dan Password!", "error");

            showMsg("Sedang login...", "success");

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                
                showMsg("Login Berhasil!", "success");
                checkUser();
            } catch (err) {
                showMsg("ERROR LOGIN: " + err.message, "error"); 
            }
        }

        // ================= LOGIKA SESI USER =================
        async function checkUser() {
            if (!supabase) return;
            const { data: { session } } = await supabase.auth.getSession();
            currentUser = session?.user;
            
            const statusDiv = document.getElementById('user-status');

            if (currentUser) {
                const uname = currentUser.user_metadata?.username || currentUser.email;
                statusDiv.innerHTML = `Login: <b>${uname}</b> <button onclick="handleLogout()" style="width:auto; padding: 5px 15px; background:red; color:white; margin-left:10px;">Logout</button>`;
                showSection('dashboard-section');
                loadMyTeams();
            } else {
                statusDiv.innerHTML = '';
                showSection('auth-section');
            }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            currentUser = null;
            showMsg("Berhasil logout.", "success");
            checkUser();
        }

        // ================= LOGIKA BIKIN TIM =================
        async function createTeam() {
            if (!currentUser) return showMsg("Harus login dulu!", "error");
            
            const name = document.getElementById('team-name').value;
            const desc = document.getElementById('team-desc').value;

            if(!name) return showMsg("Nama tim wajib diisi!", "error");

            showMsg("Menyimpan tim...", "success");

            try {
                const { error } = await supabase.from('teams').insert([{
                    owner_id: currentUser.id,
                    name: name,
                    description: desc
                }]);
                
                if (error) throw error;
                
                showMsg("Tim berhasil dibuat!", "success");
                document.getElementById('team-name').value = '';
                document.getElementById('team-desc').value = '';
                loadMyTeams();
            } catch (err) {
                showMsg("ERROR BUAT TIM: " + err.message, "error");
            }
        }

        async function loadMyTeams() {
            if (!currentUser) return;
            const { data: teams, error } = await supabase.from('teams').select('*').eq('owner_id', currentUser.id);
            const list = document.getElementById('my-teams-list');
            list.innerHTML = '';
            
            if (error || !teams || teams.length === 0) {
                list.innerHTML = '<li>Belum ada tim.</li>';
                return;
            }
            
            teams.forEach(t => {
                list.innerHTML += `<li><b>${t.name}</b> - ${t.description || 'Tidak ada deskripsi'}</li>`;
            });
        }

        window.onload = () => { checkUser(); };
    </script>
</body>
</html>
