<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TES JAVASCRIPT</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 50px 20px; }
        button { padding: 15px 30px; font-size: 18px; background-color: gold; color: black; border: none; border-radius: 5px; margin-top: 20px; cursor: pointer; }
        #hasil { margin-top: 30px; font-size: 20px; font-weight: bold; color: #4caf50; }
    </style>
</head>
<body>
    <h1>TES BROWSER LU</h1>
    <p>Klik tombol di bawah ini. Kalau nggak ada perubahan, berarti JavaScript di HP lu mati/diblokir.</p>
    
    <button onclick="tesKlik()">KLIK SAYA!</button>
    
    <div id="hasil"></div>

    <script>
        function tesKlik() {
            document.getElementById('hasil').innerText = "MANTAP! JAVASCRIPT JALAN!";
        }
    </script>
</body>
</html>
