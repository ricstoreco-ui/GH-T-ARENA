name: GH-T Arena OCR Processor

on:
  repository_dispatch:
    types: [ocr]
  workflow_dispatch: # Biar bisa dites manual dari tab Actions

jobs:
  process-ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm init -y
          npm pkg set type=module
          npm install @supabase/supabase-js tesseract.js sharp

      - name: Run OCR Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MATCH_ID: ${{ github.event.client_payload.match }}
        run: node scripts/run-ocr.js
